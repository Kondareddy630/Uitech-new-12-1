<!DOCTYPE html>
<html>
<head>
  
</head>
<body leftmargin="50px">


<form>

    <div>
        <label>Username:</label>
    </div>

    <div>
        <input type="text" placeholder="Username" name="username" required maxlength="10" minlength="5">
    </div>


    <div>
        <label>Password:</label>
    </div>

    <div>
        <input type="password"  placeholder="Password" name="password" maxlength="12" minlength="5" required>
    </div>


    <div>
        <label>Email:</label>
    </div>

    <div>
        <input type="email" placeholder="Email address" required>
    </div>

    <div>
        <label>Phone number:</label>
    </div>


    <div>
        <input type="number" placeholder="Phone number" maxlength="10" minlength="10">
    </div>


    <div>
        <label>Choose Gender:</label>
    </div>


    <div>
        <input type="radio" name="gender" value="male"> <label>Male</label>
        <input type="radio" name="gender" value="female"> <label>Female</label>
        <input type="radio" name="gender" value="other"> <label>Other</label>
    </div>


    <div>
        <label>Choose Course:</label>
    </div>

<div>
<input type="checkbox" name="course" value="java"> <label>Java</label> <br>
<input type="checkbox" name="course" value="python"> <label>Python</label><br>
<input type="checkbox" name="course" value="ui"> <label>Ui</label><br>
<input type="checkbox" name="course" value="react"> <label>React</label><br>
</div>


<div>
    <label>Choose Age:</label>
</div>

<div>
    <input type="range" min="1000" max="200000">
</div>

<div>
    <label>Date:</label>
</div>

<div>
    <input type="date" name="date">
</div>


<div>
    <label>Time:</label>
</div>


<div>
    <input type="time" name="time">
</div>

<div>
    <label>File  Upload:</label>
</div>

<div>
    <input type="file" name="file" multiple>
</div>

    <div>
        <input type="submit" value="Register">
        <input type="reset" value="Clear">

    </div>

</form>

    
</body>
</html>
