<!DOCTYPE html>
<html>
<head>
  
</head>
<body leftmargin="50px">


<form>

    <div>
        <label>Comments:</label>
    </div>

    <div>
 
        <textarea placeholder="Type message (Max 100 characters)" cols="30" rows="4" maxlength="100">
        </textarea>
    </div>


    <div>
        <label>Select City</label>
    </div>

    <div>
        <select name="city">

            <option disabled selected >---Choose City---</option>
            <option>Hyd</option>
            <option>Pune</option>
            <option >Delhi</option>
            <option>Nellore</option>
            <option>Vizag</option>
            <option value="java">Java Full Stack</option>
            <option value="python">Python Full Stack</option>
 
        </select>
    </div>

    <div>
        <label>Choose course:</label>
    </div>

    <div>
        <select>

            <optgroup label="Frontend">
                <option>html</option>
                <option>css</option>
                <option>js</option>
            </optgroup>

            <optgroup label="Backend">
                <option>java</option>
                <option>python</option>
                <option>.net</option>
            </optgroup>

           
        </select>
    </div>
   
    <input type="submit" value="Send">

</form>

    
</body>
</html>
